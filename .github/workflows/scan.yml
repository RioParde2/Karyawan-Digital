Name: Karyawan Digital

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip' # Menghemat waktu jika scanner.py menggunakan library eksternal (requests, dll)

      - name: Install Dependencies (Jika ada)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Jalankan pemindai
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Simpan dan Sinkronkan Riwayat
        run: |
          git config user.name "karyawan-digital[bot]"
          git config user.email "karyawan-digital[bot]@users.noreply.github.com"
          
          git add seen.json
          
          # Cek apakah ada perubahan
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada riwayat."
          else
            git commit -m "chore: update riwayat pemindaian [skip ci]"
            
            # Mekanisme pull --rebase untuk menghindari konflik jika ada update paralel
            git pull --rebase origin main || git pull --rebase origin master
            git push
          fi
