<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantor Karyawan Digital</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0f1d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* Container HP / App View */
        .app-container { width: 100%; max-width: 480px; height: 100vh; max-height: 850px; background: #16182e; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }

        /* Header / Papan Kinerja */
        .header { padding: 16px; background: #1e213d; border-bottom: 1px solid #2d3159; }
        .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header-title h2 { font-size: 18px; font-weight: bold; color: #ecebfa; letter-spacing: 0.5px; }
        .live-badge { background: #10b981; color: #000; font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 12px; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .metric-card { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; text-align: left; }
        .metric-label { font-size: 10px; color: #8e95c0; margin-bottom: 4px; }
        .metric-value { font-size: 14px; font-weight: bold; }
        .val-green { color: #10b981; }

/* Ruang Kantor Virtual (Menyesuaikan Proporsi Gambar) */
.office-room { 
    flex: 1; 
    position: relative; 
    background: url('office_bg.jpg') center center / contain no-repeat;
    background-color: #0d0f1d;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Balon Obrolan Karyawan (Tampil Penuh & Rapi) */
.bubble { 
    position: absolute; 
    background: rgba(255, 255, 255, 0.95); 
    color: #0f172a; 
    font-size: 9px; 
    font-weight: bold; 
    padding: 4px 8px; 
    border-radius: 8px; 
    white-space: nowrap; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
    z-index: 10;
    pointer-events: none;
}
.bubble::after { 
    content: ''; 
    position: absolute; 
    bottom: -4px; 
    left: 50%; 
    transform: translateX(-50%); 
    border-width: 4px 4px 0; 
    border-style: solid; 
    border-color: rgba(255, 255, 255, 0.95) transparent; 
}

/* Posisi Balon Obrolan yang Pas Tepat di Atas Meja Masing-masing Karyawan */
#msg-radar { top: 20%; left: 12%; }
#msg-perisai { top: 20%; right: 12%; }
#msg-sigap { bottom: 20%; left: 12%; }
#msg-warta { bottom: 20%; right: 12%; }

        /* Navigation Bar Bawah */
        .nav-bar { display: flex; justify-content: space-around; padding: 12px; background: #1e213d; border-top: 1px solid #2d3159; }
        .nav-item { text-align: center; color: #8e95c0; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header Papan Kinerja -->
    <div class="header">
        <div class="header-title">
            <h2>PAPAN KINERJA</h2>
            <span class="live-badge" id="live-time">LIVE --:--</span>
        </div>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">PnL Total</div>
                <div class="metric-value val-green" id="pnl-total">$0.00</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">PnL Mengambang</div>
                <div class="metric-value val-green" id="pnl-float">$0.00</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Posisi Terbuka</div>
                <div class="metric-value" id="pos-count">0/5</div>
            </div>
        </div>
    </div>

    <!-- Ruang Kantor Virtual -->
    <div class="office-room">
        <div class="bubble" id="msg-radar">Memindai pasar...</div>
        <div class="bubble" id="msg-perisai">Audit risiko done...</div>
        <div class="bubble" id="msg-sigap">Posisi terpantau...</div>
        <div class="bubble" id="msg-warta">Menyusun laporan...</div>
    </div>

    <!-- Navigasi Bawah -->
    <div class="nav-bar">
        <a href="#" class="nav-item active">Kantor</a>
        <a href="#" class="nav-item">Posisi</a>
        <a href="#" class="nav-item">Aktivitas</a>
    </div>
</div>

<script>
    async function updateDashboard() {
        try {
            const res = await fetch('seen.json?t=' + Date.now());
            const data = await res.json();
            const db = data.dashboard || {};

            if (db.updated_at) document.getElementById('live-time').innerText = 'LIVE ' + db.updated_at;
            if (db.pnl_total !== undefined) {
                const totalEl = document.getElementById('pnl-total');
                totalEl.innerText = (db.pnl_total >= 0 ? '$' : '-$') + Math.abs(db.pnl_total).toFixed(2);
                totalEl.className = 'metric-value ' + (db.pnl_total >= 0 ? 'val-green' : 'val-red');
            }
            if (db.pnl_floating !== undefined) {
                const floatEl = document.getElementById('pnl-float');
                floatEl.innerText = (db.pnl_floating >= 0 ? '$' : '-$') + Math.abs(db.pnl_floating).toFixed(2);
                floatEl.className = 'metric-value ' + (db.pnl_floating >= 0 ? 'val-green' : 'val-red');
            }
            if (db.open_positions_count) document.getElementById('pos-count').innerText = db.open_positions_count;

            if (db.status_karyawan) {
                document.getElementById('msg-radar').innerText = db.status_karyawan.radar || 'Memindai pasar...';
                document.getElementById('msg-perisai').innerText = db.status_karyawan.perisai || 'Siap audit...';
                document.getElementById('msg-sigap').innerText = db.status_karyawan.sigap || 'Monitoring...';
                document.getElementById('msg-warta').innerText = db.status_karyawan.warta || 'Menyusun laporan...';
            }
        } catch (e) {
            console.log('Menunggu data seen.json...');
        }
    }

    setInterval(updateDashboard, 10000);
    updateDashboard();
</script>

</body>
</html>
