<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantor Karyawan Digital</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0f1d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; max-height: 850px; background: #16182e; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }

        .header { padding: 16px; background: #1e213d; border-bottom: 1px solid #2d3159; }
        .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header-title h2 { font-size: 18px; font-weight: bold; color: #ecebfa; letter-spacing: 0.5px; }
        .live-badge { background: #10b981; color: #000; font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 12px; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .metric-card { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; text-align: left; }
        .metric-label { font-size: 10px; color: #8e95c0; margin-bottom: 4px; }
        .metric-value { font-size: 14px; font-weight: bold; }
        .val-green { color: #10b981; }
        .val-red { color: #f87171; }

        .office-room { flex: 1; position: relative; background: #0d0f1d; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .office-inner { position: relative; width: 100%; height: 100%; max-width: 450px; max-height: 300px; background: url('office_bg.jpg') center center / contain no-repeat; }

        .bubble { position: absolute; background: rgba(255, 255, 255, 0.95); color: #0f172a; font-size: 8px; font-weight: bold; padding: 3px 6px; border-radius: 6px; white-space: nowrap; box-shadow: 0 3px 8px rgba(0,0,0,0.5); z-index: 10; pointer-events: none; }
        #msg-radar::after, #msg-perisai::after { content: ''; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%); border-width: 3px 3px 0; border-style: solid; border-color: rgba(255, 255, 255, 0.95) transparent; }
        #msg-sigap::after, #msg-warta::after { content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%); border-width: 0 3px 3px; border-style: solid; border-color: transparent transparent rgba(255, 255, 255, 0.95); }
        #msg-radar { top: 30%; left: 18%; }
        #msg-perisai { top: 30%; right: 18%; }
        #msg-sigap { top: 72%; left: 18%; }
        #msg-warta { top: 72%; right: 18%; }

        /* Panel Posisi dan Aktivitas */
        .panel { display: none; flex: 1; overflow-y: auto; padding: 12px 14px; background: #0d0f1d; }
        .panel h3 { font-size: 13px; color: #8e95c0; margin: 4px 0 8px; font-weight: 600; }
        .row { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 6px; font-size: 12px; padding: 8px 6px; border-bottom: 1px solid #23264a; }
        .row.head { color: #8e95c0; font-size: 10px; }
        .log { font-size: 12px; padding: 8px 6px; border-bottom: 1px solid #23264a; line-height: 1.35; }
        .log .t { color: #8e95c0; font-size: 10px; display: block; }
        .log .who { font-weight: bold; margin-right: 6px; }
        .who.Radar { color: #38bdf8; } .who.Perisai { color: #a78bfa; } .who.Sigap { color: #34d399; } .who.Warta { color: #fbbf24; }
        .empty { color: #8e95c0; font-size: 12px; padding: 14px 6px; }

        .nav-bar { display: flex; justify-content: space-around; padding: 12px; background: #1e213d; border-top: 1px solid #2d3159; }
        .nav-item { text-align: center; color: #8e95c0; font-size: 11px; text-decoration: none; cursor: pointer; padding: 4px 14px; }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="header-title">
            <h2>PAPAN KINERJA</h2>
            <span class="live-badge" id="live-time">LIVE --:--</span>
        </div>
        <div class="metrics-grid">
            <div class="metric-card"><div class="metric-label">PnL Total</div><div class="metric-value val-green" id="pnl-total">$0.00</div></div>
            <div class="metric-card"><div class="metric-label">PnL Mengambang</div><div class="metric-value val-green" id="pnl-float">$0.00</div></div>
            <div class="metric-card"><div class="metric-label">Posisi Terbuka</div><div class="metric-value" id="pos-count">0/5</div></div>
        </div>
    </div>

    <div class="office-room" id="tab-kantor">
        <div class="office-inner">
            <div class="bubble" id="msg-radar">Memindai pasar...</div>
            <div class="bubble" id="msg-perisai">Audit risiko done...</div>
            <div class="bubble" id="msg-sigap">Posisi terpantau...</div>
            <div class="bubble" id="msg-warta">Menyusun laporan...</div>
        </div>
    </div>

    <div class="panel" id="tab-posisi"></div>
    <div class="panel" id="tab-aktivitas"></div>

    <div class="nav-bar">
        <a class="nav-item active" data-tab="kantor">Kantor</a>
        <a class="nav-item" data-tab="posisi">Posisi</a>
        <a class="nav-item" data-tab="aktivitas">Aktivitas</a>
    </div>
</div>

<script>
    function money(v) { return (v >= 0 ? '$' : '-$') + Math.abs(v).toFixed(2); }
    function setMoney(id, v) {
        var el = document.getElementById(id);
        el.innerText = money(v);
        el.className = 'metric-value ' + (v >= 0 ? 'val-green' : 'val-red');
    }
    function cell(text, cls) { var s = document.createElement('span'); s.textContent = text; if (cls) s.className = cls; return s; }
    function row(cells, head) {
        var d = document.createElement('div'); d.className = 'row' + (head ? ' head' : '');
        cells.forEach(function (c) { d.appendChild(c); }); return d;
    }
    function empty(text) { var d = document.createElement('div'); d.className = 'empty'; d.textContent = text; return d; }
    function title(text) { var h = document.createElement('h3'); h.textContent = text; return h; }

    function renderPosisi(db) {
        var box = document.getElementById('tab-posisi'); box.innerHTML = '';
        box.appendChild(title('Posisi terbuka (simulasi)'));
        var list = db.positions || [];
        if (!list.length) { box.appendChild(empty('Belum ada posisi terbuka.')); return; }
        box.appendChild(row([cell('Koin'), cell('Modal'), cell('Nilai'), cell('PnL')], true));
        list.forEach(function (p) {
            var cls = p.pnl >= 0 ? 'val-green' : 'val-red';
            box.appendChild(row([
                cell(p.sym + (p.tp1 ? ' (TP1)' : '')), cell('$' + p.cost.toFixed(0)), cell('$' + p.value.toFixed(2)),
                cell(money(p.pnl) + ' (' + p.pct.toFixed(0) + '%)', cls)
            ]));
        });
    }

    function renderAktivitas(data) {
        var box = document.getElementById('tab-aktivitas'); box.innerHTML = '';
        var closed = ((data.portfolio || {}).closed) || [];
        var wins = closed.filter(function (c) { return c.pnl > 0; }).length;
        box.appendChild(title('Trade selesai: ' + closed.length + ' (menang ' + wins + ')'));
        closed.slice(-6).reverse().forEach(function (c) {
            var d = document.createElement('div'); d.className = 'log';
            var t = document.createElement('span'); t.className = 'who ' + (c.pnl >= 0 ? 'val-green' : 'val-red');
            t.textContent = c.symbol + ' ' + (c.pnl >= 0 ? '+' : '') + c.pnl.toFixed(2) + ' USD (' + c.pct + '%)';
            d.appendChild(t); d.appendChild(document.createTextNode(c.reason || '')); box.appendChild(d);
        });
        box.appendChild(title('Aktivitas karyawan'));
        var acts = (data.activity || []).slice().reverse();
        if (!acts.length) { box.appendChild(empty('Belum ada aktivitas.')); return; }
        acts.forEach(function (a) {
            var d = document.createElement('div'); d.className = 'log';
            var t = document.createElement('span'); t.className = 't'; t.textContent = a.t;
            var w = document.createElement('span'); w.className = 'who ' + a.who; w.textContent = a.who;
            d.appendChild(t); d.appendChild(w); d.appendChild(document.createTextNode(a.txt)); box.appendChild(d);
        });
    }

    async function updateDashboard() {
        try {
            const res = await fetch('seen.json?t=' + Date.now());
            const data = await res.json();
            const db = data.dashboard || {};

            if (db.updated_at) document.getElementById('live-time').innerText = 'LIVE ' + db.updated_at;
            if (db.pnl_total !== undefined) setMoney('pnl-total', db.pnl_total);
            if (db.pnl_floating !== undefined) setMoney('pnl-float', db.pnl_floating);
            if (db.open_positions_count) document.getElementById('pos-count').innerText = db.open_positions_count;

            if (db.status_karyawan) {
                document.getElementById('msg-radar').innerText = db.status_karyawan.radar || 'Memindai pasar...';
                document.getElementById('msg-perisai').innerText = db.status_karyawan.perisai || 'Siap audit...';
                document.getElementById('msg-sigap').innerText = db.status_karyawan.sigap || 'Monitoring...';
                document.getElementById('msg-warta').innerText = db.status_karyawan.warta || 'Menyusun laporan...';
            }
            renderPosisi(db);
            renderAktivitas(data);
        } catch (e) {
            console.log('Menunggu data seen.json...');
        }
    }

    document.querySelectorAll('.nav-item').forEach(function (a) {
        a.addEventListener('click', function () {
            var tab = a.getAttribute('data-tab');
            document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.toggle('active', n === a); });
            document.getElementById('tab-kantor').style.display = tab === 'kantor' ? 'flex' : 'none';
            document.getElementById('tab-posisi').style.display = tab === 'posisi' ? 'block' : 'none';
            document.getElementById('tab-aktivitas').style.display = tab === 'aktivitas' ? 'block' : 'none';
        });
    });

    setInterval(updateDashboard, 10000);
    updateDashboard();
</script>

</body>
</html>
